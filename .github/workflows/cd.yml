name: CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-app:latest

      - name: CD
        on:
          push:
            branches:
              - master
        jobs:
          deploy:
            runs-on: self-hosted
            steps:
              - uses: actions/checkout@v4

              - name: Deploy app
                run: |
                  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-app:latest
                  docker stop goldenowl || true
                  docker rm goldenowl || true
                  docker run -d --name goldenowl -p 3000:3000 \
                    ${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-app:latest