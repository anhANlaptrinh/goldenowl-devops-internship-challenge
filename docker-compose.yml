version: '3.8'

services:
  app:
    image: ${DOCKERHUB_USERNAME}/goldenowl-app:latest
    deploy:
      replicas: 2
    restart: always
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always